name: Deploy to Play Store

permissions:
  contents: write

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy to Play Store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Bump version
        run: |
          perl -i -pe 's/version: (\d+\.\d+\.\d+)\+\d+/version: $1+${{ github.run_number }}/' pubspec.yaml
          
      - name: Commit version bump
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: bump version to ${{ github.run_number }} [skip ci]"
          file_pattern: 'pubspec.yaml'

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
        
      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          
      - name: Build AAB
        run: flutter build appbundle --release
        env:
          ANDROID_KEYSTORE_PATH: "upload-keystore.jks"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_CONFIG_JSON }}
          packageName: com.shcworks.point_hue
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
